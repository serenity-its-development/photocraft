[package]
name = "photocraft-host-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Photo's host window compiled for node (wasm-bindgen), so OneOS can drive an image through the photo.* tools in a test: the same command.batch the browser build answers craft:command with, on the same engine"

# No workspace lints: the wasm-bindgen macros expand to code the workspace's `unsafe_code = "forbid"` refuses.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
photocraft-engine = { workspace = true }
photocraft-paint = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
